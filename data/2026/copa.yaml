# Fonte pública da Copa de Futsal Feminino Vila Mariana 2026.
# Privacidade: apenas apelido, posição, time e estatísticas.
# O mapeamento p-XXX -> pessoa fica FORA do repositório.
# Não inclua nome completo, foto, contato, camisa ou data de nascimento.
# IDs e nomes-base dos times são estáveis; a UI usa displayName quando preenchido.
# Logos são opcionais e devem apontar para assets locais em public/images/times/.
#
# Estado atual: pré-competição. Elencos definidos em 17/11/2026.
# Nome público do time B ainda provisório; time C definido como "Sem Horas".
# IDs e URLs são estáveis. Horários confirmados:
# primeiro jogo do dia às 18h45 e segundo às 19h20, no 7º andar. Vi é a única goleira; as demais jogadoras atuam na linha.
# Não registre resultados fictícios.
#
# Atualizando pelo celular? Siga docs/guia-atualizacao-mobile.md:
# um jogo por commit, placar derivado dos gols em "events" e IDs no topo do arquivo.

